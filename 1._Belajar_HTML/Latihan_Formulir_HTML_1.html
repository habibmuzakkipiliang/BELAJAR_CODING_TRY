<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Latihan Formulir Sederhana</title>
</head>
<style>
     #img1 {
          float: calc();
          width: 350px;
          height: 350px;
     }

     #img2 {
          float: calc();
          width: 350px;
          height: 350px;
     }

     .header {
          line-height: 2.5em;
          font-size: medium;
          font-family:  sans-serif;
     }

     .body {
          line-height: 2.5em;
          font-size: medium;
          font-family: sans-serif;
     }
</style>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<body class="body bg-success text-black">
     <header class="header p-5 mb-5 h-100 bg-info text-black">
          <h1 class="text-center">Latihan Formulir Sederhana</h1>
     </header>

     <div class="container">
          <div class="row">
               <div class="col-sm-12 bg-white text-black">

                    <img src="https://raw.githubusercontent.com/habibmuzakkipiliang/HM_Initial_Profile_Github/refs/heads/main/HM_Profile_Github.png" alt="Gambar-1" id="img1" class="img-thumbnail img-fluid card-img">
                    <hr>
                    <br>

                    <form action="">
                         <div class="mb-5">
                              <label for="" class="form-label">
                                   Nama lengkap 
                              </label>
                              <input type="text" class="form-control" required>
                         </div>
                         <div class="mb-5">
                              <label for="" class="form-label">
                                   Nama panggilan 
                              </label>
                              <input type="text" class="form-control" required>
                         </div>
                         <div class="mb-5">
                              <label for="" class="form-label">
                                   Asal daerah 
                              </label>
                              <input type="text" class="form-control" required>
                         </div>
                         <div class="mb-5">
                              <label for="" class="form-label">
                                   Agama 
                              </label>
                              <select name="" id="" class="form-select">
                                   <option value="">Pilih Agama</option>
                                   <option value="">Islam</option>
                                   <option value="">Kristen</option>
                                   <option value="">Katolil</option>
                                   <option value="">Hindu</option>
                                   <option value="">Buddha</option>
                                   <option value="">Konghucu</option>
                              </select>
                         </div>
                         <div class="mb-5">
                              <label for="" class="form-label">
                                   Asal sekolah 
                              </label>
                              <input type="text" class="form-control">
                         </div>
                         <div class="mb-5">
                              <label for="" class="form-label">
                                   Jurusan 
                              </label>
                              <input type="text" class="form-control" required>
                         </div>
                         <div class="mb-5">
                              <label for="" class="form-label">
                                   Universitas
                              </label>
                              <input type="text" class="form-control" required>
                         </div>
                         <div class="mb-5">
                              <label for="" class="form-label">
                                   Fakultas
                              </label>
                              <input type="text" class="form-control" required>
                         </div>
                         <div class="mb-5">
                              <label for="" class="form-label">
                                   Tinggi badan 
                              </label>
                              <input type="text" class="form-control">
                         </div>
                         <div class="mb-5">
                              <label for="" class="form-label">
                                   Hobi 
                              </label>
                              <input type="text" class="form-control">
                         </div>
                         <hr>
                         <br>
                         <div class="mb-5">
                              <button type="reset" class="btn btn-dark">
                                   Hapus
                              </button>
                              <button type="submit" class="btn btn-info">Kirim</button>
                         </div>
                    </form>
               </div>
          </div>
     </div>
     
</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</html>
