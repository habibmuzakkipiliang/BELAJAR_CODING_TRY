<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Bikin JS + HTML</title>
</head>
<script>
     document.write ("Hello World")

     var a = "Halo Dunia"
     document.write (a)

     document.write ("\n --- batas --- \n")


     var isi = Number (prompt ("Masukkan isi ? "))

     if (isi >= 5) {
          document.write (`Besar, angka isi = ${isi}`)
     }

     else {
          document.write (`Kecil, angka isi = ${isi}`)
     }
</script>
<body>
     <header>
          <h1>Bikin JS + HTML</h1>
     </header>
</body>
</html>
