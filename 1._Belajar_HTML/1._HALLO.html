                    <h3><b>Fungsi + Variabel + Operasi JavaScript</b></h3>

                    <script>

                         var x = 10
                         var y = 8

                         function tambah (x, y) {
                              return x + y
                         }

                         function kurang (x, y) {
                              return x - y
                         }

                         function kali (x, y) {
                              return x * y
                         }


                         function bagi (x, y) {
                              return x / y
                         }


                         function pangkat (x, y) {
                              return x ** y
                         }


                         var hasil = `

                         <br> Hasil tambah  = ${tambah (x, y)}
                         <br> Hasil kurang  = ${kurang (x, y)}           
                         <br> Hasil kali    = ${kali (x, y)}
                         <br> Hasil bagi    = ${bagi (x, y)}
                         <br> Hasil pangkat = ${pangkat (x, y)}        
                    
                         `

                         document.write (hasil)
                    </script>

                    <hr>
                    <br>
